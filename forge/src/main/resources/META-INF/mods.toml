modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
logoFile="icon.png"
authors="${mod_authors}"
description='''${mod_description}'''

# Forge 依赖
[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

# Minecraft 版本依赖
[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# Cloth Config API 依赖（配置界面必需）
[[dependencies.${mod_id}]]
    modId="cloth_config"
    mandatory=true
    versionRange="[11.1.136,)"
    ordering="AFTER"
    side="BOTH"

# Catalogue 依赖（可选，提供模组列表界面和配置入口）
[[dependencies.${mod_id}]]
    modId="catalogue"
    mandatory=false
    versionRange="[1.8.0,)"
    ordering="AFTER"
    side="CLIENT"
